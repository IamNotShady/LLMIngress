name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POSTGRES_IMAGE: postgres:18.4-alpine

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: |
          pnpm run verify
          pnpm run verify:features

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: LLMINGRESS_VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

      - name: Resolve PostgreSQL digest
        id: postgres
        run: |
          digest="$(docker buildx imagetools inspect "$POSTGRES_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')"
          test -n "$digest"
          echo "image=$POSTGRES_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Render release assets
        run: >-
          pnpm exec tsx scripts/render-release-assets.ts
          --version "${GITHUB_REF_NAME}"
          --app-image "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          --postgres-image "${{ steps.postgres.outputs.image }}"

      - name: Require anonymous image pull
        run: |
          docker logout ghcr.io
          docker image rm "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" || true
          docker pull "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=("$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
