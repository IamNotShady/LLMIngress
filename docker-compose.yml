x-llmingress-env: &llmingress-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres
  MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
  GATEWAY_PORT: 4000
  GATEWAY_HOST: 0.0.0.0
  CONSOLE_PORT: 3000
  CONSOLE_HOST: 0.0.0.0
  WORKER_HEARTBEAT_MS: 30000
  GATEWAY_PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:4000}
  GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PUBLISH_HOST:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: llmingress-migrate:local
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment: *llmingress-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    image: llmingress-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    environment: *llmingress-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  console:
    image: llmingress-console:local
    build:
      context: .
      dockerfile: Dockerfile
      target: console
    environment: *llmingress-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${CONSOLE_PUBLISH_HOST:-127.0.0.1}:${CONSOLE_PORT:-3000}:3000"

  worker:
    image: llmingress-worker:local
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment: *llmingress-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
