x-llmingress-env: &llmingress-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:llmi-local-db@postgres:5432/postgres}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
  GATEWAY_PORT: 4000
  GATEWAY_HOST: 0.0.0.0
  CONSOLE_PORT: 3000
  CONSOLE_HOST: 0.0.0.0
  HOSTNAME: 0.0.0.0
  PORT: 3000
  WORKER_HEARTBEAT_MS: 30000

x-llmingress-build: &llmingress-build
  context: .
  dockerfile: Dockerfile
  target: runtime

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: llmi-local-db
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PUBLISH_HOST:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: llmingress-app:local
    build: *llmingress-build
    command: all
    environment:
      <<: *llmingress-env
      GATEWAY_URL: ${GATEWAY_URL:-http://127.0.0.1:4000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONSOLE_PUBLISH_HOST:-127.0.0.1}:${CONSOLE_PORT:-3000}:3000"
      - "${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
