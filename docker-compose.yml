x-llmingress-env: &llmingress-env
  NODE_ENV: production
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://postgres:llmi-local-db@postgres:5432/postgres}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LLMINGRESS_DB_POOL_MAX: ${LLMINGRESS_DB_POOL_MAX:-10}
  PROVIDER_REQUEST_TIMEOUT_MS: ${PROVIDER_REQUEST_TIMEOUT_MS:-30000}
  GATEWAY_PORT: 4000
  GATEWAY_HOST: 0.0.0.0
  GATEWAY_BODY_LIMIT_BYTES: ${GATEWAY_BODY_LIMIT_BYTES:-10485760}
  GATEWAY_STREAM_CONNECT_TIMEOUT_MS: ${GATEWAY_STREAM_CONNECT_TIMEOUT_MS:-10000}
  GATEWAY_STREAM_IDLE_TIMEOUT_MS: ${GATEWAY_STREAM_IDLE_TIMEOUT_MS:-120000}
  GATEWAY_CONFIG_NOTIFICATIONS: ${GATEWAY_CONFIG_NOTIFICATIONS:-true}
  GATEWAY_CONFIG_RECONCILE_INTERVAL_MS: ${GATEWAY_CONFIG_RECONCILE_INTERVAL_MS:-30000}
  GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-}
  GATEWAY_DEBUG_REQUEST_METADATA: ${GATEWAY_DEBUG_REQUEST_METADATA:-false}
  GATEWAY_SHUTDOWN_DRAIN_MS: ${GATEWAY_SHUTDOWN_DRAIN_MS:-10000}
  GATEWAY_READINESS_TIMEOUT_MS: ${GATEWAY_READINESS_TIMEOUT_MS:-1000}
  GATEWAY_BREAKER_ENABLED: ${GATEWAY_BREAKER_ENABLED:-true}
  GATEWAY_BREAKER_ERROR_THRESHOLD_PERCENT: ${GATEWAY_BREAKER_ERROR_THRESHOLD_PERCENT:-50}
  GATEWAY_BREAKER_WINDOW_MS: ${GATEWAY_BREAKER_WINDOW_MS:-60000}
  GATEWAY_BREAKER_MIN_REQUESTS: ${GATEWAY_BREAKER_MIN_REQUESTS:-5}
  GATEWAY_BREAKER_HALF_OPEN_AFTER_MS: ${GATEWAY_BREAKER_HALF_OPEN_AFTER_MS:-30000}
  GATEWAY_BREAKER_HALF_OPEN_CALLS: ${GATEWAY_BREAKER_HALF_OPEN_CALLS:-3}
  GATEWAY_PROVIDER_RETRIES: ${GATEWAY_PROVIDER_RETRIES:-2}
  GATEWAY_PROVIDER_RETRY_INITIAL_DELAY_MS: ${GATEWAY_PROVIDER_RETRY_INITIAL_DELAY_MS:-200}
  GATEWAY_HEALTH_SUMMARY_CACHE_TTL_MS: ${GATEWAY_HEALTH_SUMMARY_CACHE_TTL_MS:-5000}
  CONSOLE_PORT: 3000
  CONSOLE_HOST: 0.0.0.0
  HOSTNAME: 0.0.0.0
  PORT: 3000
  WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-30000}
  WORKER_JOB_LEASE_MS: ${WORKER_JOB_LEASE_MS:-60000}
  WORKER_SHUTDOWN_GRACE_MS: ${WORKER_SHUTDOWN_GRACE_MS:-25000}
  WORKER_MAX_JOB_DURATION_MS: ${WORKER_MAX_JOB_DURATION_MS:-300000}
  WORKER_ID: ${WORKER_ID:-}
  WORKER_MODEL_CATALOG_CACHE_TTL_MS: ${WORKER_MODEL_CATALOG_CACHE_TTL_MS:-1800000}
  WORKER_ACTIVITY_RETENTION_DAYS: ${WORKER_ACTIVITY_RETENTION_DAYS:-30}
  WORKER_HEALTH_EVENT_RETENTION_DAYS: ${WORKER_HEALTH_EVENT_RETENTION_DAYS:-30}
  WORKER_JOB_RETENTION_DAYS: ${WORKER_JOB_RETENTION_DAYS:-7}
  RETENTION_CLEANUP_INTERVAL_MS: ${RETENTION_CLEANUP_INTERVAL_MS:-86400000}
  GROK_OAUTH_CLIENT_ID: ${GROK_OAUTH_CLIENT_ID:-}
  MINIMAX_OAUTH_CLIENT_ID: ${MINIMAX_OAUTH_CLIENT_ID:-}

x-llmingress-build: &llmingress-build
  context: .
  dockerfile: Dockerfile
  target: runtime

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: llmi-local-db
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PUBLISH_HOST:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: llmingress-app:local
    build: *llmingress-build
    command: all
    environment:
      <<: *llmingress-env
      GATEWAY_URL: "${GATEWAY_URL:-http://127.0.0.1:${GATEWAY_PORT:-4000}}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONSOLE_PUBLISH_HOST:-127.0.0.1}:${CONSOLE_PORT:-3000}:3000"
      - "${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
