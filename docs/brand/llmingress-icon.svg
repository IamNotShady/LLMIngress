<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="LLMIngress icon">
  <defs>
    <radialGradient id="canvas" cx="50%" cy="48%" r="64%">
      <stop offset="0%" stop-color="#15131d" />
      <stop offset="100%" stop-color="#09090d" />
    </radialGradient>
    <linearGradient id="panel" x1="230" y1="170" x2="800" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24212e" />
      <stop offset="100%" stop-color="#15141c" />
    </linearGradient>
    <linearGradient id="activeSlot" x1="268" y1="438" x2="436" y2="586" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b494ff" />
      <stop offset="100%" stop-color="#7b5cf6" />
    </linearGradient>
    <linearGradient id="quietSlot" x1="360" y1="270" x2="742" y2="754" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#716d82" />
      <stop offset="100%" stop-color="#393747" />
    </linearGradient>
    <filter id="panelGlow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur" />
      <feFlood flood-color="#8b6cff" flood-opacity="0.28" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="activeGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur" />
      <feFlood flood-color="#8b6cff" flood-opacity="0.75" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#canvas)" />

  <rect
    x="176"
    y="168"
    width="672"
    height="672"
    rx="132"
    fill="url(#panel)"
    stroke="#755bd6"
    stroke-opacity="0.86"
    stroke-width="4"
    filter="url(#panelGlow)"
  />
  <rect
    x="202"
    y="194"
    width="620"
    height="620"
    rx="108"
    fill="none"
    stroke="#625b78"
    stroke-opacity="0.28"
    stroke-width="2"
  />

  <g filter="url(#activeGlow)">
    <rect x="270" y="438" width="172" height="148" rx="32" fill="url(#activeSlot)" />
    <rect x="404" y="486" width="64" height="52" rx="26" fill="#8b6cff" />
    <path d="M282 438h118c19 0 35 11 44 27" fill="none" stroke="#d7c8ff" stroke-opacity="0.48" stroke-width="3" stroke-linecap="round" />
  </g>

  <g fill="url(#quietSlot)" stroke="#8e88a8" stroke-opacity="0.42" stroke-width="2">
    <rect x="436" y="270" width="152" height="160" rx="34" />
    <rect x="436" y="594" width="152" height="160" rx="34" />
    <rect x="592" y="438" width="164" height="148" rx="34" />
  </g>
  <g fill="#4b485c">
    <rect x="486" y="398" width="52" height="68" rx="26" />
    <rect x="486" y="558" width="52" height="68" rx="26" />
    <rect x="556" y="486" width="70" height="52" rx="26" />
  </g>

  <rect x="424" y="420" width="176" height="176" rx="36" fill="#0b0b10" />
  <rect
    x="424"
    y="420"
    width="176"
    height="176"
    rx="36"
    fill="none"
    stroke="#615d73"
    stroke-opacity="0.42"
    stroke-width="2"
  />
</svg>
